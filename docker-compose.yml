# Production-like stack built from the repository: postgres, redis, one-shot migration, API,
# worker and web. It is meant for local verification and as a template; real deployments should use
# a managed database and a secrets manager (docs/DEPLOYMENT.md). Nothing is bind-mounted.
#
#   docker compose up -d --build            # start everything
#   docker compose --profile demo run --rm seed   # optional demo data (NEVER in production)
#
# Settings come from `.env` (optional) and the defaults below. The defaults run in
# ENVIRONMENT=development because production mode refuses to start without real secrets,
# Pinecone and a real embedding provider.
x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hospitality}:${POSTGRES_PASSWORD:-hospitality}@postgres:5432/${POSTGRES_DB:-hospitality}
  REDIS_URL: redis://redis:6379/0
  RATE_LIMIT_BACKEND: redis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospitality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospitality}
      POSTGRES_DB: ${POSTGRES_DB:-hospitality}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospitality} -d ${POSTGRES_DB:-hospitality}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    image: hospitality-api:local
    env_file: [{path: .env, required: false}]
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    image: hospitality-api:local
    env_file: [{path: .env, required: false}]
    environment: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    image: hospitality-api:local
    env_file: [{path: .env, required: false}]
    environment: *api-env
    command: ["python", "-m", "worker.main"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  web:
    build: {context: ., dockerfile: infra/docker/web.Dockerfile}
    image: hospitality-web:local
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  seed:
    image: hospitality-api:local
    profiles: ["demo"]
    env_file: [{path: .env, required: false}]
    environment: *api-env
    command: ["python", "-m", "scripts.seed"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

volumes:
  postgres_data:
