[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "hospitality-api"
version = "0.1.0"
description = "HospitalityOS AI backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.2,<3.3",
    "redis>=5.0,<5.1",
    "bcrypt>=4.2,<6",
    "pyjwt>=2.9,<2.10",
    "python-multipart>=0.0.9",
    "structlog>=24.4,<25",
    "python-docx>=1.1,<2",
    "pypdf>=5.0,<7",
    "anthropic>=1.13,<2",
    "langgraph>=1.2,<2",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
# Production integrations, installed on demand (Docker: --build-arg EXTRAS=pinecone,embeddings,aws).
# None of these has been exercised against the live service in this repository.
pinecone = ["pinecone>=5"]
embeddings = ["sentence-transformers>=3"]
aws = ["boto3>=1.34"]
dev = [
    "pytest>=8.3,<8.4",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<1.12",
    "fakeredis>=2.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "../worker"]
testpaths = ["tests"]
